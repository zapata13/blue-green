<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quarkus Shape Configurator</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #canvas { display: flex; justify-content: center; margin-top: 30px; }
        .shape { width: 200px; height: 200px; transition: all 0.3s ease; }
        .circle { border-radius: 50%; }
        .square { border-radius: 0%; }
    </style>
</head>
<body>
    <h1>Dynamic Quarkus Blue-Green Deployment Test</h1>
    <div id="canvas">
        <div id="shapeElement" class="shape"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
